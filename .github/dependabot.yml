version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - chore
      - P3
    commit-message:
      prefix: chore
      include: scope
    # Packages that only work at matching versions move in one PR.
    groups:
      size-limit:
        patterns:
          - size-limit
          - '@size-limit/*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
    ignore:
      # The Harness SDK (@deepseek-ai/dsh-*, @deepseek-ai/cordis) is pinned to
      # the Harness release this plugin is adapted to and must match the peer
      # and engines.dsh ranges. Moving it is a manual adaptation, never a bot PR.
      - dependency-name: '@deepseek-ai/*'
      # React is supplied by the DSH Host (React 18). A semver-major bump
      # would typecheck against an API the runtime does not provide.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react-dom'
        update-types:
          - version-update:semver-major

  # Workflow actions. Majors move the action runtime (Node 20 -> 24 was the
  # last one), so they arrive as one grouped PR that CI exercises; the publish
  # workflow is only read, not run, before merging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    labels:
      - chore
      - P3
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
