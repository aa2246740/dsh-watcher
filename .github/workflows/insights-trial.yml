name: Insights trial build
on:
  push:
    branches: [feat/session-insights-rc1]
    paths-ignore: ['lib/**','package-lock.json','pnpm-lock.yaml','docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: insights-trial
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/feat/session-insights-rc1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-insights-rc1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/apply-insights-patch.mjs && node scripts/finalize-insights.mjs
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Full test suite
        run: npm test
      - name: Commit tested build to trial branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests package.json package-lock.json README.md DESIGN.md
          git add -f lib/*.js lib/*.js.map
          git diff --cached --quiet || git commit -m 'build: compile tested RC1 insights trial [skip ci]'
          git push origin HEAD:refs/heads/feat/session-insights-rc1
