name: Publish to npm

# Push a tag like v0.8.0 (must match package.json version) to publish.
# Auth is npm Trusted Publishing (OIDC) - no NPM_TOKEN needed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      npm_config_auto_install_peers: 'false'
      PNPM_CONFIG_AUTO_INSTALL_PEERS: 'false'
    steps:
      - uses: actions/checkout@v7

      # No `version`: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then echo "tag v$TAG != package.json $PKG"; exit 1; fi

      - run: pnpm install --frozen-lockfile --config.auto-install-peers=false
      - run: pnpm run build
      - run: pnpm test

      - name: Publish
        run: |
          npm install -g npm@latest
          npm publish --access public

      - name: GitHub release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
